# UI Tests — Playwright against OrangeHRM demo
#
# KNOWN GAPS (production hardening not implemented here):
# - Slack / Microsoft Teams notification on failure (webhook + needs.test-chromium.result)
# - Test result trends over time (e.g. Datadog CI Visibility, ReportPortal, or Allure history)
# - Environment-specific runs (staging vs prod matrix; secrets per environment)
# - Required status checks + branch protection on main before merge
# - Flaky-test quarantine job (auto-retry + open issue when flake rate exceeds threshold)
# - Parallel matrix across more browsers (WebKit, mobile viewports) with selective smoke on PR
# - Scheduled soak / visual regression against a stable internal environment (not shared demo)
# - Cache Playwright browsers between runs (actions/cache on ~/.cache/ms-playwright)
# - Deploy merged HTML report to GitHub Pages or S3 for persistent failure archives

name: UI Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Nightly regression against the shared OrangeHRM demo — 02:00 UTC
    - cron: '0 2 * * *'

concurrency:
  group: ui-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ui-tests

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile check
        run: npx tsc --noEmit

  test-chromium:
    name: Test (Chromium shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CI: true
      PLAYWRIGHT_BLOB_REPORT: 'true'
      ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME }}
      ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests (Chromium shard)
        # Sharding: --shard=INDEX/TOTAL splits the test list across parallel runners.
        # Blob reporter (CI config) enables merge-reports in merge-chromium-reports job.
        # test.fail() tests: expected failure → exit 0; unexpected pass → exit 1.
        run: >
          npx playwright test
          --project=chromium
          --project=chromium-login
          --shard=${{ matrix.shard }}/2

      - name: Upload blob report (merge input)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-chromium-${{ matrix.shard }}
          path: ui-tests/blob-report/
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-chromium-shard-${{ matrix.shard }}
          path: ui-tests/test-results/
          retention-days: 7

  merge-chromium-reports:
    name: Merge Chromium Reports
    runs-on: ubuntu-latest
    needs: test-chromium
    if: always() && needs.test-chromium.result == 'failure'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports from all shards
        uses: actions/download-artifact@v4
        with:
          path: ui-tests/all-blob-reports
          pattern: blob-report-chromium-*
          merge-multiple: true

      - name: Merge into single HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium-merged
          path: ui-tests/playwright-report/
          retention-days: 7

  test-firefox:
    name: Test (Firefox)
    runs-on: ubuntu-latest
    needs: lint
    env:
      CI: true
      ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME }}
      ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Firefox
        run: npx playwright install firefox --with-deps

      - name: Run Playwright tests (Firefox)
        # test.fail() tests: expected failure → exit 0; unexpected pass → exit 1 (bug fixed alert).
        run: npx playwright test --project=firefox --project=firefox-login

      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-firefox
          path: ui-tests/playwright-report/
          retention-days: 7

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-firefox
          path: ui-tests/test-results/
          retention-days: 7

  report-status:
    name: Report Status
    runs-on: ubuntu-latest
    # No checkout in this job — override workflow default (ui-tests/) so bash can start.
    defaults:
      run:
        working-directory: .
    needs:
      - lint
      - test-chromium
      - merge-chromium-reports
      - test-firefox
    if: always()
    steps:
      - name: Print job summary
        run: |
          echo "## UI Test Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint | ${{ needs.lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test (Chromium, 2 shards) | ${{ needs.test-chromium.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Merge Chromium Reports | ${{ needs.merge-chromium-reports.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test (Firefox) | ${{ needs.test-firefox.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "On failure, download merged Chromium HTML report and per-shard traces from the Actions artifacts tab (retained 7 days)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Expected failures:** \`test.fail()\` tests in \`tests/known-bugs/\` count as passed when the app bug reproduces. If one unexpectedly passes, the test job fails — investigate whether the bug was fixed and remove the annotation." >> "$GITHUB_STEP_SUMMARY"

          echo "Lint:                    ${{ needs.lint.result }}"
          echo "Test (Chromium, shards): ${{ needs.test-chromium.result }}"
          echo "Merge Chromium Reports:  ${{ needs.merge-chromium-reports.result }}"
          echo "Test (Firefox):          ${{ needs.test-firefox.result }}"

      - name: Fail pipeline if any required job failed
        if: >-
          needs.lint.result != 'success' ||
          needs.test-chromium.result != 'success' ||
          needs.test-firefox.result != 'success'
        run: exit 1
