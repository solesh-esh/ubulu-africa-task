name: UI Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Nightly regression against the shared OrangeHRM demo — 02:00 UTC
    - cron: '0 2 * * *'

concurrency:
  group: ui-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ui-tests

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile check
        run: npx tsc --noEmit

  test-chromium:
    name: Test (Chromium)
    runs-on: ubuntu-latest
    needs: lint
    env:
      CI: true
      ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME }}
      ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests (Chromium)
        # test.fail() tests: expected failure → exit 0; unexpected pass → exit 1 (bug fixed alert).
        # No special flags needed — Playwright handles expected failures natively.
        run: npx playwright test --project=chromium --project=chromium-login

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: ui-tests/playwright-report/
          retention-days: 7

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-chromium
          path: ui-tests/test-results/
          retention-days: 7

  test-firefox:
    name: Test (Firefox)
    runs-on: ubuntu-latest
    needs: lint
    env:
      CI: true
      ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME }}
      ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Firefox
        run: npx playwright install firefox --with-deps

      - name: Run Playwright tests (Firefox)
        # test.fail() tests: expected failure → exit 0; unexpected pass → exit 1 (bug fixed alert).
        run: npx playwright test --project=firefox --project=firefox-login

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-firefox
          path: ui-tests/playwright-report/
          retention-days: 7

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-firefox
          path: ui-tests/test-results/
          retention-days: 7

  report-status:
    name: Report Status
    runs-on: ubuntu-latest
    needs:
      - lint
      - test-chromium
      - test-firefox
    if: always()
    steps:
      - name: Print job summary
        run: |
          echo "## UI Test Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint | ${{ needs.lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test (Chromium) | ${{ needs.test-chromium.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test (Firefox) | ${{ needs.test-firefox.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download HTML reports from the Actions artifacts tab (retained 7 days)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Expected failures:** \`test.fail()\` tests in \`tests/known-bugs/\` count as passed when the app bug reproduces. If one unexpectedly passes, the test job fails — investigate whether the bug was fixed and remove the annotation." >> "$GITHUB_STEP_SUMMARY"

          echo "Lint:              ${{ needs.lint.result }}"
          echo "Test (Chromium):   ${{ needs.test-chromium.result }}"
          echo "Test (Firefox):     ${{ needs.test-firefox.result }}"

      - name: Fail pipeline if any required job failed
        if: >-
          needs.lint.result != 'success' ||
          needs.test-chromium.result != 'success' ||
          needs.test-firefox.result != 'success'
        run: exit 1
